<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Mindvibe – 3-Tiered Mental Health Web App" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Mindvibe</title>
  </head>
  <body>
    <div id="app">
      <div style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#1565C0;font-family:system-ui,sans-serif">
        <div style="font-size:2.5rem">🏥</div>
        <div style="font-weight:600;font-size:1.1rem">VRS</div>
        <div style="font-size:0.85rem;color:#666">Setting up…</div>
      </div>
    </div>
    <script>
      // Restore path encoded by 404.html redirect
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') })
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          )
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
